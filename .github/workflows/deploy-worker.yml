name: Deploy WorkAI backend

on:
  workflow_dispatch:
  push:
    paths:
      - 'worker/**'
      - '.github/workflows/deploy-worker.yml'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install Wrangler
        working-directory: worker
        run: npm install
      - name: Deploy Worker
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
      - name: Configure backend secrets
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
          COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          BRAVE_SEARCH_API_KEY: ${{ secrets.BRAVE_SEARCH_API_KEY }}
          WORKAI_GITHUB_TOKEN: ${{ secrets.WORKAI_GITHUB_TOKEN }}
          WORKAI_DEVICE_TOKEN: ${{ secrets.WORKAI_DEVICE_TOKEN }}
        run: |
          printf '%s' "$NVIDIA_API_KEY" | npx wrangler secret put NVIDIA_API_KEY
          if [ -n "$AGNES_API_KEY" ]; then printf '%s' "$AGNES_API_KEY" | npx wrangler secret put AGNES_API_KEY; fi
          if [ -n "$COHERE_API_KEY" ]; then printf '%s' "$COHERE_API_KEY" | npx wrangler secret put COHERE_API_KEY; fi
          if [ -z "$OPENCODE_API_KEY" ]; then echo "OPENCODE_API_KEY is missing from GitHub Actions secrets" >&2; exit 1; fi
          if [ -n "$OPENCODE_API_KEY" ]; then printf '%s' "$OPENCODE_API_KEY" | npx wrangler secret put OPENCODE_API_KEY; fi
          if [ -n "$BRAVE_SEARCH_API_KEY" ]; then printf '%s' "$BRAVE_SEARCH_API_KEY" | npx wrangler secret put BRAVE_SEARCH_API_KEY; fi
          printf '%s' "$WORKAI_GITHUB_TOKEN" | npx wrangler secret put WORKAI_GITHUB_TOKEN
          printf '%s' "$WORKAI_DEVICE_TOKEN" | npx wrangler secret put WORKAI_DEVICE_TOKEN
      - name: Verify deployment
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deployments list
      - name: Verify every configured Zen model
        env:
          WORKAI_DEVICE_TOKEN: ${{ secrets.WORKAI_DEVICE_TOKEN }}
          WORKAI_BACKEND_URL: ${{ vars.WORKAI_BACKEND_URL || 'https://workai-backend.lolkeckay222.workers.dev' }}
        run: |
          for model in nemotron-3-ultra-free mimo-v2.6-flash-free muse-spark-1.3-contributor-free deepseek-v4-flash-vision-exp; do
            MODEL="$model" python3 -c 'import json,os;print(json.dumps({"model":os.environ["MODEL"],"messages":[{"role":"user","content":"Reply with OK"}]}))' > /tmp/workai-request.json
            curl --fail-with-body --retry 5 --retry-all-errors --retry-delay 2 -sS \
              -H "X-WorkAI-Token: $WORKAI_DEVICE_TOKEN" -H 'Content-Type: application/json' \
              --data-binary @/tmp/workai-request.json "$WORKAI_BACKEND_URL/v1/chat" > /tmp/workai-response.json
            MODEL="$model" python3 -c 'import json,os;result=json.load(open("/tmp/workai-response.json"));assert result.get("model")==os.environ["MODEL"] and result.get("answer","").strip(),result'
            echo "Verified $model"
          done
